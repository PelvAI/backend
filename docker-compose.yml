version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=alma
      - POSTGRES_PASSWORD=alma_secret
      - POSTGRES_DB=alma_db
    ports:
      # Host 5433: evita conflito com pelvai-db (ChatBot) que já usa 5432
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alma -d alma_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    extra_hosts:
      # ChatBot (pelvai-app) publicado no host :8000
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://alma:alma_secret@db:5432/alma_db
      - SECRET_KEY=dev_secret_key_change_in_production
      # Dentro do contentor, 127.0.0.1 não alcança o ChatBot no host
      - CHATBOT_BASE_URL=http://host.docker.internal:8000
      - CHATBOT_SERVICE_TOKEN=change-me-long-random-shared-secret-min-32-chars
      - CHATBOT_TIMEOUT_SECONDS=120
      - CHATBOT_UPLOAD_TIMEOUT_SECONDS=600
      - CHATBOT_REQUIRED=true
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  postgres_data:
